submission:
  title: "ClinicalAI Monitor — Clinical Trial Risk Monitor & Protocol Deviation Detector"

  problem_statement: >
    A major clinical trial has 5,000+ patient visits across 200+ sites. Protocol deviations —
    missed visits, wrong dosing, banned co-medications — go undetected until the FDA audit.
    A single rejected submission delays drug approval by 6–12 months and costs $50–100M.
    Risk managers need real-time visibility into which sites are highest risk before problems escalate.

  solution_summary: >
    ClinicalAI Monitor is an AI-powered web application that compares patient visit records
    against the ICH E6 GCP protocol specification in real time, classifies each deviation by
    severity (Major / Minor / Administrative), calculates a 0–100 weighted risk score per patient
    and per research site, and generates print-ready CAPA reports with AI-recommended corrective
    and preventive actions — reducing CAPA preparation from days to seconds.

  key_features:
    - "Real-time AI protocol deviation detection across 200 patients and 10 research sites"
    - "ICH E6 GCP severity classification (Major / Minor / Administrative) with weighted 0–100 risk scoring"
    - "Site-level risk dashboard ranking all hospitals by aggregate risk for proactive CRA targeting"
    - "One-click CAPA report generator with root cause analysis, responsible teams, and follow-up dates"
    - "Interactive Patient Checker — analyze any patient record instantly with full AI explanation"

  tech_stack:
    languages: ["HTML5", "CSS3", "JavaScript (ES6+)"]
    frameworks: []
    ibm_technologies: ["IBM Bob AI", "IBM Plex Sans", "IBM Design System"]
    databases: []
    other: ["Canvas API", "ICH E6 GCP Rules Engine", "GitHub Actions CI/CD"]

  what_we_are_most_proud_of: >
    The AI engine (ai-engine.js) implements a complete ICH E6 GCP-compliant rule set that
    analyses five deviation categories, calculates weighted risk scores, and generates
    full CAPA recommendations — all in vanilla JavaScript with zero external dependencies.
    The system processes 200 patient records sub-second and produces print-ready regulatory
    reports that could genuinely be submitted to an FDA audit.

  known_limitations: >
    The application uses a client-side rule-based AI engine with simulated patient data.
    It does not connect to a live EDC system (Medidata Rave / Oracle Clinical One) or
    IBM watsonx.ai inference endpoint in the current prototype. NLP analysis of free-text
    clinical notes is listed as future scope. Authentication and role-based access control
    are not implemented in this hackathon version.

